<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layer Relationships · WildfireDB</title>
<script src="config.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1117; --panel: #161b22; --panel2: #21262d; --line: #30363d;
    --text: #e6edf3; --muted: #8b949e; --blue: #58a6ff; --green: #3fb950;
    --amber: #d29922; --red: #f85149; --purple: #a371f7; --cyan: #39c5cf;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  a { color: inherit; }
  header { position: sticky; top: 0; z-index: 10; background: rgba(13,17,23,.96);
    backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .head { max-width: 1500px; margin: auto; padding: 18px 24px 14px; }
  .head-top { display: flex; align-items: flex-start; gap: 18px; }
  .back { text-decoration: none; border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .back:hover { border-color: var(--blue); color: var(--blue); }
  h1 { margin: 0; font-size: clamp(20px, 3vw, 30px); letter-spacing: -.4px; }
  .subtitle { color: var(--muted); font-size: 13px; line-height: 1.5; margin-top: 5px; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
  .segmented { display: flex; background: var(--panel2); border: 1px solid var(--line);
    padding: 3px; border-radius: 9px; }
  button, select { font: inherit; }
  .segmented button { border: 0; color: var(--muted); background: transparent; cursor: pointer;
    padding: 7px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; }
  .segmented button.active { color: white; background: #1f6feb; }
  label.control { display: flex; align-items: center; gap: 7px; color: var(--muted);
    font-size: 12px; }
  select { background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 28px 7px 9px; }
  main { max-width: 1500px; margin: auto; padding: 24px; }
  #status { color: var(--muted); font-size: 13px; padding: 40px 4px; }
  .stage-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
  .stage-grid.single { grid-template-columns: minmax(0, 900px); justify-content: center; }
  .stage { min-width: 0; }
  .stage-title { display: flex; justify-content: space-between; align-items: baseline;
    margin: 0 0 11px; }
  .stage-title h2 { margin: 0; font-size: 17px; }
  .stage-before .stage-title h2 { color: var(--blue); }
  .stage-after .stage-title h2 { color: var(--amber); }
  .stage-title span { font-size: 11px; color: var(--muted); }
  .cards { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; margin-bottom: 12px; }
  .card { border: 1px solid var(--line); background: var(--panel); border-radius: 9px;
    padding: 12px; min-width: 0; }
  .card .value { font-size: clamp(17px, 2vw, 23px); font-weight: 700; white-space: nowrap; }
  .card .label { color: var(--muted); font-size: 10px; margin-top: 4px; line-height: 1.25; }
  .flow { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: 7px;
    align-items: center; margin-bottom: 12px; }
  .flow-node { background: var(--panel); border: 1px solid var(--line); border-radius: 9px;
    padding: 10px; text-align: center; min-width: 0; }
  .flow-node strong { display: block; font-size: 16px; }
  .flow-node span { display: block; color: var(--muted); font-size: 9px; margin-top: 3px; }
  .arrow { color: var(--muted); font-size: 17px; }
  section.box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    margin-bottom: 12px; overflow: hidden; }
  .box-head { padding: 11px 13px; border-bottom: 1px solid var(--line); display: flex;
    justify-content: space-between; align-items: center; gap: 8px; }
  .box-head h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .box-head span { color: var(--muted); font-size: 10px; text-align: right; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 11px; }
  th { text-align: right; color: var(--muted); font-weight: 600; padding: 8px 10px;
    border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  td { text-align: right; padding: 8px 10px; border-bottom: 1px solid #21262d; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr.total-row { background: #1c2128; font-weight: 700; }
  .pct { color: var(--muted); font-size: 9px; margin-left: 3px; }
  .source-cell { min-width: 145px; }
  .source-bar { height: 4px; border-radius: 2px; background: #30363d; margin-top: 4px; overflow: hidden; }
  .source-bar i { display: block; height: 100%; background: var(--cyan); }
  .tag { display: inline-block; border-radius: 12px; padding: 2px 7px; font-size: 9px; }
  .hard { color: #56d364; background: #173923; }
  .soft { color: #e3b341; background: #3d3216; }
  .unmatched { color: #ff7b72; background: #442323; }
  .method { margin-top: 18px; padding: 14px 16px; border: 1px solid var(--line);
    border-radius: 10px; color: var(--muted); font-size: 11px; line-height: 1.65; }
  .method strong { color: var(--text); }
  .hidden { display: none !important; }
  @media (max-width: 1050px) { .stage-grid { grid-template-columns: 1fr; }
    .stage-grid.single { grid-template-columns: 1fr; } }
  @media (max-width: 650px) { .head, main { padding-left: 13px; padding-right: 13px; }
    .head-top { gap: 10px; } .back { padding: 7px 8px; }
    .cards { grid-template-columns: 1fr 1fr; } .flow { grid-template-columns: 1fr; }
    .arrow { transform: rotate(90deg); text-align: center; height: 13px; } }
</style>
</head>
<body>
<header>
  <div class="head">
    <div class="head-top">
      <a class="back" href="index.html">← Map</a>
      <div>
        <h1>Fire perimeter · Damage labels · Building footprints</h1>
        <div class="subtitle">Event-deduplicated spatial relationship tables with separate pre-model and post-model views.</div>
      </div>
    </div>
    <div class="controls">
      <div class="segmented" aria-label="Prediction stage">
        <button data-stage="before" onclick="setStage('before')">Before model</button>
        <button data-stage="compare" class="active" onclick="setStage('compare')">Compare</button>
        <button data-stage="after" onclick="setStage('after')">After model</button>
      </div>
      <label class="control">Show
        <select id="layer-filter" onchange="render()">
          <option value="all">All relationships</option>
          <option value="perimeters">Fire perimeters</option>
          <option value="labels">Damage labels</option>
          <option value="footprints">Building footprints</option>
        </select>
      </label>
      <label class="control">Damage class
        <select id="category-filter" onchange="render()">
          <option value="All">All classes</option>
          <option value="No Damage">No Damage</option>
          <option value="Destroyed">Destroyed</option>
          <option value="Others">Others</option>
        </select>
      </label>
    </div>
  </div>
</header>
<main>
  <div id="status">Loading the latest precomputed spatial analysis…</div>
  <div id="content"></div>
</main>
<script>
const API = (window.WILDFIRE_API || '').replace(/\/$/, '');
const SOURCE_NAMES = { ms: 'Microsoft Building Footprints', osm: 'OpenStreetMap',
  ours2: 'Supplemental footprint layer', google: 'Google', unknown: 'Unknown' };
let DATA = null;
let stageMode = 'compare';
const fmt = n => Number(n || 0).toLocaleString();
const pct = (n, d) => d ? `${(100 * n / d).toFixed(1)}%` : '—';

function setStage(mode) {
  stageMode = mode;
  document.querySelectorAll('[data-stage]').forEach(b => b.classList.toggle('active', b.dataset.stage === mode));
  render();
}

function metricCell(value, total) {
  return `${fmt(value)} <span class="pct">${pct(value, total)}</span>`;
}

function stagePanel(key) {
  const d = DATA.stages[key], e = d.events, labels = d.damage_labels, fp = d.footprints;
  const category = document.getElementById('category-filter').value;
  const selected = labels.categories[category];
  const filter = document.getElementById('layer-filter').value;
  const categories = category === 'All' ? ['No Damage', 'Destroyed', 'Others', 'All'] : [category];
  const rows = categories.map(name => {
    const r = labels.categories[name];
    return `<tr class="${name === 'All' ? 'total-row' : ''}"><td>${name}</td>
      <td>${fmt(r.total)}</td><td>${metricCell(r.inside, r.total)}</td>
      <td>${metricCell(r.outside, r.total)}</td><td>${metricCell(r.without_perimeter, r.total)}</td></tr>`;
  }).join('');
  const sourceRows = fp.sources.map(s => `<tr><td class="source-cell">${SOURCE_NAMES[s.source] || s.source}
      <div class="source-bar"><i style="width:${s.percent}%"></i></div></td>
      <td>${fmt(s.count)}</td><td>${s.percent.toFixed(2)}%</td><td>${fmt(s.event_count)}</td></tr>`).join('');
  const stageLabel = key === 'before' ? 'Before model · Human survey only' : 'After model · Human + predicted';
  return `<article class="stage stage-${key}">
    <div class="stage-title"><h2>${stageLabel}</h2><span>${key === 'before' ? 'source observations' : 'unique labelled buildings'}</span></div>
    <div class="cards">
      <div class="card"><div class="value">${fmt(e.unique_events)}</div><div class="label">Deduplicated fire events</div></div>
      <div class="card"><div class="value">${fmt(e.matched_mtbs_events)}</div><div class="label">Unique matched MTBS events</div></div>
      <div class="card"><div class="value">${fmt(selected.total)}</div><div class="label">${category} damage records</div></div>
      <div class="card"><div class="value">${fmt(fp.total)}</div><div class="label">Footprints inside perimeter</div></div>
    </div>
    <div class="flow">
      <div class="flow-node"><strong>${fmt(e.matched_mtbs_events)}</strong><span>MATCHED MTBS PERIMETERS</span></div><div class="arrow">→</div>
      <div class="flow-node"><strong>${fmt(selected.inside)}</strong><span>${category.toUpperCase()} LABELS INSIDE</span></div><div class="arrow">↔</div>
      <div class="flow-node"><strong>${fmt(fp.total)}</strong><span>FOOTPRINTS INSIDE</span></div>
    </div>
    <section class="box layer-perimeters ${filter !== 'all' && filter !== 'perimeters' ? 'hidden' : ''}">
      <div class="box-head"><h3>1 · Fire perimeter matching</h3><span>${fmt(DATA.mtbs_total_events)} MTBS events available</span></div>
      <div class="table-scroll"><table><thead><tr><th>Event status</th><th>Unique events</th><th>Share</th></tr></thead><tbody>
        <tr><td><span class="tag hard">Hard match</span></td><td>${fmt(e.hard)}</td><td>${pct(e.hard,e.unique_events)}</td></tr>
        <tr><td><span class="tag soft">Soft match</span></td><td>${fmt(e.soft)}</td><td>${pct(e.soft,e.unique_events)}</td></tr>
        <tr><td><span class="tag unmatched">Unmatched</span></td><td>${fmt(e.unmatched)}</td><td>${pct(e.unmatched,e.unique_events)}</td></tr>
        <tr class="total-row"><td>Total deduplicated events</td><td>${fmt(e.unique_events)}</td><td>100.0%</td></tr>
      </tbody></table></div>
    </section>
    <section class="box layer-labels ${filter !== 'all' && filter !== 'labels' ? 'hidden' : ''}">
      <div class="box-head"><h3>2 · Damage labels relative to perimeter</h3><span>0 m geometry test</span></div>
      <div class="table-scroll"><table><thead><tr><th>Damage class</th><th>Total</th><th>Inside perimeter</th><th>Outside perimeter</th><th>No matched perimeter</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
    </section>
    <section class="box layer-footprints ${filter !== 'all' && filter !== 'footprints' ? 'hidden' : ''}">
      <div class="box-head"><h3>3 · Building footprints inside perimeter</h3><span>${fmt(fp.events_with_layer)} events with a footprint layer</span></div>
      <div class="table-scroll"><table><thead><tr><th>Footprint source</th><th>Count</th><th>Share</th><th>Events covered</th></tr></thead>
        <tbody>${sourceRows}<tr class="total-row"><td>Total</td><td>${fmt(fp.total)}</td><td>100.00%</td><td>${fmt(fp.events_with_layer)}</td></tr></tbody></table></div>
    </section>
  </article>`;
}

function render() {
  if (!DATA) return;
  const keys = stageMode === 'compare' ? ['before','after'] : [stageMode];
  document.getElementById('content').innerHTML = `<div class="stage-grid ${keys.length === 1 ? 'single' : ''}">${keys.map(stagePanel).join('')}</div>
    <div class="method"><strong>Method.</strong> ${DATA.methodology.hard_match}. ${DATA.methodology.soft_match}.
    ${DATA.methodology.inside_test}. Footprints use ${DATA.methodology.footprints.toLowerCase()}.
    <br><strong>Generated:</strong> ${new Date(DATA.generated_at).toLocaleString()} · Percentages use the total in each row or table as their denominator.</div>`;
}

fetch(`${API}/api/analytics/layer_relationships`)
  .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
  .then(data => { DATA = data; document.getElementById('status').classList.add('hidden'); render(); })
  .catch(error => { document.getElementById('status').innerHTML = `<strong style="color:#f85149">Analysis unavailable.</strong> ${error.message}`; });
</script>
</body>
</html>
